apiVersion: apps/v1
kind: Deployment
metadata:
  name: light-service
  labels:
    app: light-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: light-service
  template:
    metadata:
      labels:
        app: light-service
    spec:
      containers:
      - name: light-service
        image: voidschema/light-service:6cfce53
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "200m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
